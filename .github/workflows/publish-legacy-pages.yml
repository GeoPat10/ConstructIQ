name: Publish ConstructIQ 2.0
on:
  push:
    branches: [release/v2-source]
permissions:
  contents: write
  pages: write
concurrency:
  group: constructiq-production-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'GeoPat10/ConstructIQ'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 scripts/build.py --production
      - name: Publish validated static files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_LIVE_SHA: 3efd2f6d6f3590e025aff7a3ff9cb4f2d2d59ee1
        run: |
          git fetch origin main
          actual=$(git rev-parse origin/main)
          git worktree add /tmp/constructiq-release origin/main
          cp -a dist/. /tmp/constructiq-release/
          cd /tmp/constructiq-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html setup.html manifest.webmanifest icon-192.png apple-touch-icon.png sw.js assets config
          if git diff --cached --quiet; then
            echo 'This validated app build is already published.'
            exit 0
          fi
          test "$actual" = "$EXPECTED_LIVE_SHA" || { echo 'Live source changed; review before publishing.'; exit 1; }
          git commit -m 'Update ConstructIQ: named alerts and original logo'
          git push origin HEAD:main
          gh api --method POST repos/GeoPat10/ConstructIQ/pages/builds
